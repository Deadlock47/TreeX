name: Build TreeX iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --non-interactive
        env:
          BIN_ID: ${{ secrets.BIN_ID }}

      - name: Build iOS locally
        run: eas build --platform ios --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BIN_ID: ${{ secrets.BIN_ID }}

      - name: Find IPA
        run: |
          echo "Searching for IPA..."
          find . -name "*.ipa" -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TreeX-iOS
          path: "*.ipa"
          if-no-files-found: error